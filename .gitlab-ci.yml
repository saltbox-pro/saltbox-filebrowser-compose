---

include:

  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'

  - project: 'saltbox/ci-lib'
    file: 'check-addon-image-tags.yml'

  - project: 'saltbox/ci-lib'
    file: 'mirror-repo.yml'

  - project: 'saltbox/ci-lib'
    file: 'close-github-pr.yml'


Build FileBrowser Compose image:
  extends: .build-image
  variables:
    DOCKERFILE: 'docker/Dockerfile'


Build FileBrowser Proxy image:
  extends: .build-image
  variables:
    DOCKERFILE: 'docker/proxy/Dockerfile'
    REGISTRY_ADDITIONAL_PATH: '/proxy'


Mirror Repository:
  extends: .mirror-repo
  stage: build


Check for GitHub PR to close:
  extends: .close-github-pr
  stage: build
