---

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'

Build filebrowser image for tag:
  extends: .build-image
  variables:
    DOCKERFILE: 'docker/Dockerfile'
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'

Build filebrowser image for branch:
  extends: .build-image
  variables:
    DOCKERFILE: 'docker/Dockerfile'
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'
