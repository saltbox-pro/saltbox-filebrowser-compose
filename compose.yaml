x-default-service: &default
  restart: "on-failure"
  stop_grace_period: ${STOP_GRACE_PERIOD}

services:
  saltbox-filebrowser:
    <<: *default
    image: "gtstef/filebrowser:${FILEBROWSER_IMAGE_TAG}"
    user: "0"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      FILEBROWSER_CONFIG: "/etc/filebrowser/config.yaml"
    volumes:
      - "filebrowser_db:/home/filebrowser"
      - "${FILEBROWSER_COMPOSE_DIR}/config.yaml:/etc/filebrowser/config.yaml:ro"
      - "${SALT_MASTER_STORAGE_PATH}:/srv/salt"
      - "${SSHFS_STORAGE_PATH}:/srv/sshfs"
      - "salt_repos:/srv/saltbox_salt"

  saltbox-filebrowser-adapter:
    <<: *default
    image: "${IMAGE_REGISTRY}/saltbox-filebrowser-adapter:${FILEBROWSER_ADAPTER_IMAGE_TAG}"
    environment:
      ADAPTER_FILEBROWSER_HOST: "${FILEBROWSER_HOST}"
      ADAPTER_FILEBROWSER_PORT: "${FILEBROWSER_PORT:-80}"
      ADAPTER_FILEBROWSER_BASE_ROUTE: "${FILEBROWSER_BASE_ROUTE}"
      ADAPTER_DISCOVERY_URL: "http://saltbox-gateway:${GATEWAY_HTTP_PORT}/api/discovery"
      ADAPTER_SERVICE_NAME: "${FILEBROWSER_SERVICE_NAME}"
      ADAPTER_SERVICE_TITLE: "${FILEBROWSER_SERVICE_TITLE}"
      ADAPTER_SERVICE_DESCRIPTION: "${FILEBROWSER_SERVICE_DESCRIPTION}"
      ADAPTER_SERVICE_VENDOR: "${FILEBROWSER_SERVICE_VENDOR}"
      ADAPTER_SERVER_OUTER_SOCKET: "${WEB_SERVER_OUTER_SOCKET}"
      ADAPTER_SERVER_SCHEME: "https"
      ADAPTER_INSTANCE_ID: "${FILEBROWSER_INSTANCE_ID}"
    depends_on:
      saltbox-filebrowser:
        condition: service_started
        restart: false

  saltbox-filesystem-frontend:
    <<: *default
    image: "${IMAGE_REGISTRY}/saltbox-filesystem-frontend:${FRONTEND_IMAGE_TAG}"
    expose:
      - ${FRONTEND_HTTP_PORT}

volumes:
  filebrowser_db:
    external: false
