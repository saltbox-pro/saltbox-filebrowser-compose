    - path: "/srv/migrator"
      name: "migrator"
      config:
        denyByDefault: false
        private: false
        disabled: false
        indexingIntervalMinutes: 0
        disableIndexing: false
        conditionals:
          hidden: false
          ignoreHidden: false
          ignoreZeroSizeFolders: false
          rules:
        defaultEnabled: true
        createUserDir: false
